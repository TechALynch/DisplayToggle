<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <title>Turning a display off and back on</title>
  <rect x="0" y="0" width="960" height="236" rx="14" fill="#202020"/>

  <!-- Panel 1: all on -->
  <rect x="16" y="16" width="288" height="204" rx="10" fill="#2b2b2b" stroke="#1c1c1c"/>
  <text x="32" y="44" font-size="15" font-weight="600" fill="#ffffff">1. All on</text>
  <rect x="37.5" y="84.3" width="99.4" height="61" rx="4" fill="#484848"/>
  <rect x="139.9" y="71.5" width="40.2" height="73.8" rx="4" fill="#484848"/>
  <rect x="183.1" y="75" width="99.4" height="54.6" rx="4" fill="#484848"/>
  <text x="87.2" y="119" font-size="11" fill="#ffffff" text-anchor="middle">Laptop</text>
  <text x="160" y="112" font-size="11" fill="#ffffff" text-anchor="middle">DELL</text>
  <text x="232.8" y="106" font-size="11" fill="#ffffff" text-anchor="middle">ES-G27F2Q</text>
  <text x="32" y="182" font-size="13" fill="#c8c8c8">Laptop, DELL in portrait, ES-G27F2Q</text>
  <text x="32" y="200" font-size="13" fill="#c8c8c8">side by side.</text>

  <!-- arrow -->
  <path d="M312 110 l12 0 m-5 -5 l5 5 l-5 5" stroke="#8a8a8a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Panel 2: DELL off -->
  <rect x="336" y="16" width="288" height="204" rx="10" fill="#2b2b2b" stroke="#1c1c1c"/>
  <text x="352" y="44" font-size="15" font-weight="600" fill="#ffffff">2. Turn DELL off</text>
  <rect x="379.1" y="84.3" width="99.4" height="61" rx="4" fill="#484848"/>
  <rect x="481.5" y="75" width="99.4" height="54.6" rx="4" fill="#484848"/>
  <text x="428.8" y="119" font-size="11" fill="#ffffff" text-anchor="middle">Laptop</text>
  <text x="531.2" y="106" font-size="11" fill="#ffffff" text-anchor="middle">ES-G27F2Q</text>
  <path d="M560 63 l-36 0 m6 -5 l-6 5 l6 5" stroke="#F38064" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="352" y="182" font-size="13" fill="#c8c8c8">ES-G27F2Q slides left to close</text>
  <text x="352" y="200" font-size="13" fill="#c8c8c8">the gap. No Keep/Revert prompt.</text>

  <!-- arrow -->
  <path d="M632 110 l12 0 m-5 -5 l5 5 l-5 5" stroke="#8a8a8a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Panel 3: back on -->
  <rect x="656" y="16" width="288" height="204" rx="10" fill="#2b2b2b" stroke="#1c1c1c"/>
  <text x="672" y="44" font-size="15" font-weight="600" fill="#ffffff">3. Turn DELL back on</text>
  <rect x="677.5" y="84.3" width="99.4" height="61" rx="4" fill="#484848"/>
  <rect x="779.9" y="71.5" width="40.2" height="73.8" rx="4" fill="#F38064"/>
  <rect x="823.1" y="75" width="99.4" height="54.6" rx="4" fill="#484848"/>
  <text x="727.2" y="119" font-size="11" fill="#ffffff" text-anchor="middle">Laptop</text>
  <text x="800" y="112" font-size="11" fill="#000000" text-anchor="middle">DELL</text>
  <text x="872.8" y="106" font-size="11" fill="#ffffff" text-anchor="middle">ES-G27F2Q</text>
  <text x="672" y="182" font-size="13" fill="#c8c8c8">Windows restores its saved layout:</text>
  <text x="672" y="200" font-size="13" fill="#c8c8c8">same spot, rotation and resolution.</text>
</svg>
